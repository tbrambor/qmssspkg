# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.13"

# Install the package and the "docs" dependency group with uv (respects uv.lock)
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
