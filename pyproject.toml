[project]
name = "qmsspkg"
version = "1.0.2"
description = "Python package that eases the pain of concatenating Pandas categoricals!"
readme = "README.md"
authors = [{ name = "Thomas Brambor", email = "tbrambor@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
]
docs = [
    "myst-nb>=1.4",
    "sphinx>=9.0",
    "sphinx-autoapi>=3.8",
    "sphinx-rtd-theme>=3.1",
]

[tool.uv]
default-groups = ["dev", "docs"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
